apiVersion: v1
kind: ConfigMap
metadata:
  name: m7s-config
data:
  server.toml: |
    [server]
    http_bind = "0.0.0.0:8180"
    rtmp_bind = "0.0.0.0:1935"
    gop_cache = 500
    backlog = 32768

    [tls]
    enabled = false
    cert = "config/cert.pem"
    key = "config/key.pem"

    [rtsp]
    enabled = true
    bind = "0.0.0.0:8554"

    [gb28181]
    enabled = false

    [hls]
    enabled = true
    segment_secs = 4
    max_segments = 6

    [record]
    enabled = true
    dir = "/data/record"

    [cluster]
    enabled = false
    node_id = "m7s-0"
    advertise = "127.0.0.1:8180"

    [auth]
    publish_key = ""
    api_token = ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: m7s-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: m7s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: m7s
  template:
    metadata:
      labels:
        app: m7s
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: m7s
          image: m7s-rs:local
          imagePullPolicy: IfNotPresent
          args: ["--config", "/app/config/server.toml"]
          ports:
            - { name: http, containerPort: 8180 }
            - { name: rtmp, containerPort: 1935 }
            - { name: rtsp, containerPort: 8554 }
            - { name: whep, containerPort: 8081 }
            - { name: whip, containerPort: 8082 }
            - { name: onvif, containerPort: 8083 }
            - { name: grpc, containerPort: 50051 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - { name: config, mountPath: /app/config }
            - { name: data, mountPath: /data }
      volumes:
        - name: config
          configMap:
            name: m7s-config
        - name: data
          persistentVolumeClaim:
            claimName: m7s-data
---
apiVersion: v1
kind: Service
metadata:
  name: m7s
spec:
  selector:
    app: m7s
  ports:
    - { name: http, port: 8180, targetPort: http }
    - { name: rtmp, port: 1935, targetPort: rtmp }
    - { name: rtsp, port: 8554, targetPort: rtsp }
    - { name: grpc, port: 50051, targetPort: grpc }
